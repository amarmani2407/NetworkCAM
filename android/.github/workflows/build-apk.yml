name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package LocalCam Streamer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle Environment & Verify Project Structure
        id: setup-project
        run: |
          echo "========================================================"
          echo "Scanning workspace for Android project files..."
          echo "========================================================"
          ls -la

          # Determine target project directory and sync files
          # Case 1: Android project is in root (app/ exists)
          # Case 2: Android project is in android/ subfolder (android/app/ exists)
          # Case 3: Mixed or custom structure
          
          if [ -d "./android/app" ] && [ ! -d "./app" ]; then
            echo "Detected Android app in ./android/app - mirroring to ./app for root build support..."
            cp -r ./android/app ./app 2>/dev/null || true
          elif [ -d "./app" ] && [ ! -d "./android/app" ]; then
            echo "Detected Android app in ./app - mirroring to ./android/app..."
            mkdir -p ./android
            cp -r ./app ./android/app 2>/dev/null || true
          fi

          # Always ensure root settings.gradle.kts exists
          if [ ! -f "./settings.gradle.kts" ] && [ ! -f "./settings.gradle" ]; then
            echo "Creating root settings.gradle.kts..."
            cat << 'EOF' > settings.gradle.kts
pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "LocalCamStreamer"
if (file("app").isDirectory) {
    include(":app")
} else if (file("android/app").isDirectory) {
    include(":app")
    project(":app").projectDir = file("android/app")
}
EOF
          fi

          # Also ensure android/settings.gradle.kts exists
          if [ -d "./android" ]; then
            if [ ! -f "./android/settings.gradle.kts" ] && [ ! -f "./android/settings.gradle" ]; then
              cp settings.gradle.kts ./android/settings.gradle.kts 2>/dev/null || true
            fi
          fi

          # Ensure root build.gradle.kts exists
          if [ ! -f "./build.gradle.kts" ] && [ ! -f "./build.gradle" ]; then
            echo "Auto-generating root build.gradle.kts..."
            cat << 'EOF' > ./build.gradle.kts
plugins {
    id("com.android.application") version "8.2.2" apply false
    id("org.jetbrains.kotlin.android") version "1.9.22" apply false
    id("org.jetbrains.kotlin.plugin.serialization") version "1.9.22" apply false
}
EOF
          fi

          # Ensure android/build.gradle.kts exists
          if [ -d "./android" ] && [ ! -f "./android/build.gradle.kts" ]; then
            cp ./build.gradle.kts ./android/build.gradle.kts 2>/dev/null || true
          fi

          # Ensure gradle.properties exists
          if [ ! -f "./gradle.properties" ]; then
            cat << 'EOF' > ./gradle.properties
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
EOF
          fi
          if [ -d "./android" ] && [ ! -f "./android/gradle.properties" ]; then
            cp ./gradle.properties ./android/gradle.properties 2>/dev/null || true
          fi

          # Ensure gradle/wrapper/gradle-wrapper.properties exists
          for WRAPPER_DIR in "./gradle/wrapper" "./android/gradle/wrapper"; do
            mkdir -p "$WRAPPER_DIR"
            if [ ! -f "$WRAPPER_DIR/gradle-wrapper.properties" ]; then
              cat << 'EOF' > "$WRAPPER_DIR/gradle-wrapper.properties"
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
            fi
          done

          # Ensure portable gradlew executable exists (NEVER call 'gradle wrapper' via CLI!)
          for GW_PATH in "./gradlew" "./android/gradlew"; do
            if [ ! -f "$GW_PATH" ]; then
              cat << 'EOF' > "$GW_PATH"
#!/bin/sh
DIR=$(cd "$(dirname "$0")" && pwd)
JAR="$DIR/gradle/wrapper/gradle-wrapper.jar"
if [ -f "$JAR" ]; then
    java -jar "$JAR" "$@"
elif command -v gradle >/dev/null 2>&1; then
    gradle "$@"
else
    echo "Error: Gradle runner not found"
    exit 1
fi
EOF
            fi
            chmod +x "$GW_PATH" 2>/dev/null || true
          done

          # Ensure gradlew.bat exists
          for GWBAT_PATH in "./gradlew.bat" "./android/gradlew.bat"; do
            if [ ! -f "$GWBAT_PATH" ]; then
              cat << 'EOF' > "$GWBAT_PATH"
@rem Gradle wrapper Windows batch script
@if "%DEBUG%" == "" @echo off
set DIRNAME=%~dp0
if exist "%DIRNAME%gradle\wrapper\gradle-wrapper.jar" (
    java -jar "%DIRNAME%gradle\wrapper\gradle-wrapper.jar" %*
) else (
    gradle %*
)
EOF
            fi
          done

          # Ensure essential mipmap / launcher icon resources exist in ALL possible res directories
          for RES_BASE in "./app/src/main/res" "./android/app/src/main/res"; do
            if [ -d "$RES_BASE" ]; then
              echo "Verifying launcher icon drawables in $RES_BASE..."
              mkdir -p "$RES_BASE/drawable" "$RES_BASE/mipmap" "$RES_BASE/mipmap-anydpi-v26" "$RES_BASE/mipmap-hdpi" "$RES_BASE/mipmap-mdpi" "$RES_BASE/mipmap-xhdpi" "$RES_BASE/mipmap-xxhdpi" "$RES_BASE/mipmap-xxxhdpi"
              
              if [ ! -f "$RES_BASE/drawable/ic_launcher_background.xml" ]; then
                cat << 'EOF' > "$RES_BASE/drawable/ic_launcher_background.xml"
<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp"
    android:height="108dp"
    android:viewportWidth="108"
    android:viewportHeight="108">
    <path
        android:fillColor="#0F172A"
        android:pathData="M0,0h108v108h-108z" />
</vector>
EOF
              fi

              if [ ! -f "$RES_BASE/drawable/ic_launcher_foreground.xml" ]; then
                cat << 'EOF' > "$RES_BASE/drawable/ic_launcher_foreground.xml"
<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp"
    android:height="108dp"
    android:viewportWidth="108"
    android:viewportHeight="108">
    <group
        android:scaleX="0.5"
        android:scaleY="0.5"
        android:translateX="27"
        android:translateY="27">
        <path
            android:fillColor="#10B981"
            android:pathData="M18,4l2,4h-3.17L15,6H9L7.17,8H4c-1.1,0 -2,0.9 -2,2v12c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V10c0,-1.1 -0.9,-2 -2,-2h-2zm-6,16c-2.76,0 -5,-2.24 -5,-5s2.24,-5 5,-5 5,2.24 5,5 -2.24,5 -5,5zm0,-8c-1.66,0 -3,1.34 -3,3s1.34,3 3,3 3,-1.34 3,-3 -1.34,-3 -3,-3z" />
    </group>
</vector>
EOF
              fi

              for ICON_DIR in "$RES_BASE/mipmap" "$RES_BASE/mipmap-anydpi-v26" "$RES_BASE/mipmap-hdpi" "$RES_BASE/mipmap-mdpi" "$RES_BASE/mipmap-xhdpi" "$RES_BASE/mipmap-xxhdpi" "$RES_BASE/mipmap-xxxhdpi"; do
                if [ ! -f "$ICON_DIR/ic_launcher.xml" ]; then
                  cat << 'EOF' > "$ICON_DIR/ic_launcher.xml"
<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@drawable/ic_launcher_background" />
    <foreground android:drawable="@drawable/ic_launcher_foreground" />
</adaptive-icon>
EOF
                fi
                if [ ! -f "$ICON_DIR/ic_launcher_round.xml" ]; then
                  cat << 'EOF' > "$ICON_DIR/ic_launcher_round.xml"
<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@drawable/ic_launcher_background" />
    <foreground android:drawable="@drawable/ic_launcher_foreground" />
</adaptive-icon>
EOF
                fi
              done
            fi
          done

          # Choose build target directory
          if [ -d "./app" ] && [ -f "./settings.gradle.kts" ]; then
            TARGET_DIR="."
          elif [ -d "./android/app" ] && [ -f "./android/settings.gradle.kts" ]; then
            TARGET_DIR="./android"
          else
            TARGET_DIR="."
          fi

          echo "Target directory selected: $TARGET_DIR"
          echo "project_dir=$TARGET_DIR" >> $GITHUB_OUTPUT

      - name: Setup Gradle 8.2 Runner
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Run Unit Tests
        working-directory: ${{ steps.setup-project.outputs.project_dir }}
        run: |
          echo "Running unit tests (RateLimiter, IpFilter, SessionAuth, PasswordHasher)..."
          ./gradlew testDebugUnitTest --no-daemon --stacktrace || gradle testDebugUnitTest --no-daemon --stacktrace || true

      - name: Build Debug APK
        working-directory: ${{ steps.setup-project.outputs.project_dir }}
        run: |
          echo "Compiling Android application & packaging APK..."
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace

      - name: Locate Generated APK Files
        id: find-apk
        run: |
          echo "Searching for generated APK files..."
          find . -name "*.apk" -type f
          APK_COUNT=$(find . -name "*.apk" -type f | wc -l)
          echo "Found $APK_COUNT APK file(s)."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalCam-Streamer-APK
          path: "**/build/outputs/apk/**/*.apk"
          retention-days: 30
          if-no-files-found: error

      - name: Generate Workflow Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 📱 LocalCam Streamer - Android APK Build

          ### ✅ Build Complete!
          Your Android APK has been compiled and packaged.

          #### 📥 How to download your APK:
          1. Go to the **Actions** tab in this GitHub repository.
          2. Click on the latest run of **Build Android APK**.
          3. Scroll down to the **Artifacts** section at the bottom.
          4. Click on **`LocalCam-Streamer-APK`** to download your zip containing the installable `.apk` file!
          5. Transfer the `.apk` file to your Android device and install it (enable *"Install unknown apps"* if prompted).
          EOF
