name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle Project Directory & Files
        id: prepare-gradle
        run: |
          echo "Inspecting repository contents..."
          ls -la

          # Determine target project directory
          if [ -d "./android" ]; then
            TARGET_DIR="./android"
          else
            TARGET_DIR="."
          fi
          echo "Target project directory: $TARGET_DIR"
          echo "project_dir=$TARGET_DIR" >> $GITHUB_OUTPUT

          # Ensure settings.gradle.kts exists in TARGET_DIR
          if [ ! -f "$TARGET_DIR/settings.gradle.kts" ] && [ ! -f "$TARGET_DIR/settings.gradle" ]; then
            echo "Generating settings.gradle.kts in $TARGET_DIR..."
            cat << 'EOF' > "$TARGET_DIR/settings.gradle.kts"
pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "LocalCamStreamer"
include(":app")
EOF
          fi

          # Ensure root build.gradle.kts exists in TARGET_DIR
          if [ ! -f "$TARGET_DIR/build.gradle.kts" ] && [ ! -f "$TARGET_DIR/build.gradle" ]; then
            echo "Generating root build.gradle.kts in $TARGET_DIR..."
            cat << 'EOF' > "$TARGET_DIR/build.gradle.kts"
plugins {
    id("com.android.application") version "8.2.2" apply false
    id("org.jetbrains.kotlin.android") version "1.9.22" apply false
    id("org.jetbrains.kotlin.plugin.serialization") version "1.9.22" apply false
}
EOF
          fi

          # Ensure gradle-wrapper.properties exists
          mkdir -p "$TARGET_DIR/gradle/wrapper"
          if [ ! -f "$TARGET_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            cat << 'EOF' > "$TARGET_DIR/gradle/wrapper/gradle-wrapper.properties"
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          fi

          echo "Directory contents of $TARGET_DIR:"
          ls -la "$TARGET_DIR"

      - name: Setup Gradle 8.2 Runner
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Bootstrap Gradle Wrapper
        working-directory: ${{ steps.prepare-gradle.outputs.project_dir }}
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Generating gradlew wrapper..."
            gradle wrapper --gradle-version 8.2 --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: Run Unit Tests
        working-directory: ${{ steps.prepare-gradle.outputs.project_dir }}
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace || true

      - name: Build Debug APK
        working-directory: ${{ steps.prepare-gradle.outputs.project_dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalCam-Streamer-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 30
          if-no-files-found: error
